name: Mirror the deployed rating site

# The application runs at https://sxyz-elo-rating.pages.dev. This job pulls its
# page and shared dataset into the repository, then records the change as a pull
# request that it merges itself. It runs on a schedule so the copy here follows
# the deployment without anyone pushing by hand. It never runs on push or on
# pull_request, so untrusted content cannot reach this job's write token and the
# job cannot retrigger itself.
#
# Two repository settings are required, and both are already applied:
#   * Settings > Actions > General > "Allow GitHub Actions to create and approve
#     pull requests" - without it `gh pr create` fails.
#   * Settings > General > "Allow auto-merge" - without it the auto-merge step
#     falls back to merging directly.

on:
  schedule:
    # Every eight hours: 05:17, 13:17 and 21:17 UTC, which is 13:17, 21:17 and
    # 05:17 in UTC+8. Off the top of the hour on purpose, since scheduled runs
    # queued at :00 are the ones most likely to be delayed.
    - cron: '17 5,13,21 * * *'
  workflow_dispatch:
    inputs:
      merge:
        description: Merge the pull request this run opens
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mirror-live-site
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: sync/live-site
      TITLE: 'chore(sync): mirror the deployed site'
      CO_AUTHOR: 'Co-authored-by: Tang Yixiao <115929632+tangyixiao@users.noreply.github.com>'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Copy the deployed page and dataset
        env:
          SUMMARY: ${{ runner.temp }}/summary.json
          BODY: ${{ runner.temp }}/pr-body.md
        run: |
          python3 scripts/sync_live_site.py \
            --summary "$SUMMARY" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --pr-body "$BODY"

      - name: Detect changes
        id: changes
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "The repository already matches the deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push the mirror branch
        if: steps.changes.outputs.found == 'true'
        env:
          MESSAGE: ${{ runner.temp }}/commit-message.txt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > "$MESSAGE" <<TEXT
          $TITLE

          Copy the page shell, manifest, icons and shared dataset from
          https://sxyz-elo-rating.pages.dev so one revision carries both the
          application and the data it publishes.

          $CO_AUTHOR
          TEXT
          git commit --quiet -F "$MESSAGE"
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open the pull request
        if: steps.changes.outputs.found == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ runner.temp }}/pr-body.md
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$BODY"
            echo "Reused open pull request #$number." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$BODY" > /dev/null
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            echo "Opened pull request #$number." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge the pull request
        if: steps.changes.outputs.found == 'true' && (github.event_name != 'workflow_dispatch' || inputs.merge)
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Prefer GitHub's own auto-merge so the request lands as soon as GitHub
          # reports it mergeable, even if a required check is added later.
          if gh pr merge "$NUMBER" --squash --auto \
              --subject "$TITLE (#$NUMBER)" \
              --body "$CO_AUTHOR"; then
            echo "Auto-merge enabled for #$NUMBER." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Auto-merge unavailable; merging directly." >> "$GITHUB_STEP_SUMMARY"
            for attempt in $(seq 1 20); do
              state=$(gh pr view "$NUMBER" --json mergeable --jq '.mergeable')
              [ "$state" = "MERGEABLE" ] && break
              echo "attempt $attempt: mergeable=$state"
              sleep 15
            done
            gh pr merge "$NUMBER" --squash \
              --subject "$TITLE (#$NUMBER)" \
              --body "$CO_AUTHOR"
          fi

          # Wait for the merge to actually happen before reporting success, so a
          # failed merge cannot pass silently.
          for attempt in $(seq 1 40); do
            state=$(gh pr view "$NUMBER" --json state --jq '.state')
            [ "$state" = "MERGED" ] && break
            echo "waiting for the merge: attempt $attempt, state=$state"
            sleep 15
          done

          gh pr view "$NUMBER" --json state,mergedAt,mergeCommit \
            --jq '"state=\(.state) mergedAt=\(.mergedAt) mergeCommit=\(.mergeCommit.oid)"' \
            | tee -a "$GITHUB_STEP_SUMMARY"

          state=$(gh pr view "$NUMBER" --json state --jq '.state')
          if [ "$state" != "MERGED" ]; then
            echo "Pull request #$NUMBER did not merge (state=$state)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git push origin --delete "$BRANCH" || true

      - name: Leave the pull request open for review
        if: steps.changes.outputs.found == 'true' && github.event_name == 'workflow_dispatch' && !inputs.merge
        run: |
          echo "Pull request #${{ steps.pr.outputs.number }} is open and waiting for a manual merge." >> "$GITHUB_STEP_SUMMARY"
